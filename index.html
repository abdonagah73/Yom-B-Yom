<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard - Notifications</title>
    <!--  Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header  -->
    <header class="navbar">
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">To Do List</a>
            <a href="#">Notes</a>
            <a href="#">Project</a>
            <a href="#">Calendar</a>
            <a href="#">Financial</a>
            <a href="#">Social</a>
            <a href="#" class="active">Notifications</a>
        </div>
    </header>

    <!-- Container -->
    <main class="main-content">
        <div class="notifications-card">
            
            <!-- Card Header -->
            <div class="card-header">
                <div class="header-title">
                    <h2>Notifications</h2>
                    <span class="badge" id="unread-count">0</span>
                </div>
                <button class="btn-mark-all" onclick="markAllAsRead()">Mark all as read</button>
            </div>

            <!-- Notifications  Area -->
            <div class="notifications-list" id="notifications-list">
                <!-- Data rendered dynamically from JS -->
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
