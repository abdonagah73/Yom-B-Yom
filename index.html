<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Motivation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="motivation-section">
    <div class="section-title">
      <span class="heart-icon">&#9825;</span>
      <h2>DAILY MOTIVATION</h2>
    </div>
    <div class="cards-grid">
      <div class="card">
        <div class="card-image">
          <img src="img1.jpeg" alt="Flowers">
        </div>
        <div class="card-content">
          <p>Stay patient<br>and trust your<br>journey.</p>
          <span class="card-heart">&#9825;</span>
        </div>
      </div>
      <div class="card">
        <div class="card-image">
          <img src="img2.jpeg" alt="Coffee Cup">
        </div>
        <div class="card-content">
          <p>Small progress<br>is still<br>progress.</p>
          <span class="card-heart">&#9825;</span>
        </div>
      </div>
      <div class="card">
        <div class="card-image">
          <img src="img3.jpeg" alt="Journal and Pen">
        </div>
        <div class="card-content">
          <p>Discipline today<br>leads to freedom<br>tomorrow.</p>
          <span class="card-heart">&#9825;</span>
        </div>
      </div>

    </div>

  </section>

</body>
</html>
