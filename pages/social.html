<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yom-B-Yom | Social Community</title>

    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/social.css">
</head>
<body>

    <!-- Mobile Header -->
    <header class="sidebar-mobile-header">
        <a href="../index.html" class="logo">Yom-B-Yom</a>
        <button class="sidebar-mobile-toggle" aria-label="Toggle Navigation">
            <i class="bi bi-list"></i>
            <span>Menu</span>
        </button>
    </header>

    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <a href="../index.html" class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <i class="bi bi-heart-fill"></i>
                </div>
                <span>Yom-B-Yom</span>
            </a>

            <!-- Logged-in User Profile Widget -->
            <div class="sidebar-user-box logged-in">
                <a href="profile.html" class="sidebar-user-info">
                    <div class="sidebar-avatar">U</div>
                    <div class="sidebar-user-details">
                        <span class="sidebar-user-name">Friend</span>
                        <span class="sidebar-user-badge">Active Member</span>
                    </div>
                </a>
                <button class="sidebar-logout-btn" type="button" title="Sign Out">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Home</span>
                </a>
                <a href="To Do List.html" class="nav-item">
                    <i class="bi bi-check2-square"></i>
                    <span>To Do List</span>
                </a>
                <a href="notes.html" class="nav-item">
                    <i class="bi bi-journal-text"></i>
                    <span>Notes</span>
                </a>
                <a href="project.html" class="nav-item">
                    <i class="bi bi-kanban-fill"></i>
                    <span>Project</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <i class="bi bi-calendar3"></i>
                    <span>Calendar</span>
                </a>
                <a href="financial.html" class="nav-item">
                    <i class="bi bi-wallet2"></i>
                    <span>Financial</span>
                </a>
                <a href="social.html" class="nav-item active">
                    <i class="bi bi-chat-heart-fill"></i>
                    <span>Social</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="bi bi-person-circle"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="sidebar-auth-buttons">
                    <a href="sign-in.html#login" class="sidebar-auth-btn login">Login</a>
                    <a href="sign-in.html#register" class="sidebar-auth-btn register">Register</a>
                </div>

                <div class="sidebar-theme-row">
                    <button id="themeToggle" class="sidebar-theme-btn" type="button" title="Toggle Theme" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                        <span class="theme-label">Theme</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="social-main-container">
                
                <!-- Header Title Section -->
                <header class="social-header-section">
                    <h1>Social Community</h1>
                    <p>
                        Connect with fellow achievers. Discover their active habits, projects, tasks, and hobbies as shared on their public profiles.
                    </p>
                </header>

                <!-- Search & Filter Toolbar -->
                <div class="social-toolbar">
                    <div class="social-search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="socialSearchInput" placeholder="Search people, hobbies, projects, tasks...">
                    </div>

                    <div class="social-filters">
                        <button class="social-filter-btn active" data-filter="all">All</button>
                        <button class="social-filter-btn" data-filter="hobbies"><i class="bi bi-heart-pulse-fill"></i> Hobbies</button>
                        <button class="social-filter-btn" data-filter="tasks"><i class="bi bi-check-circle-fill"></i> Tasks</button>
                        <button class="social-filter-btn" data-filter="projects"><i class="bi bi-rocket-takeoff-fill"></i> Projects</button>
                        <button class="social-filter-btn" data-filter="habits"><i class="bi bi-lightning-charge-fill"></i> Habits</button>
                    </div>

                    <div class="members-count-badge" id="publicMembersCount">
                        Loading...
                    </div>
                </div>

                <!-- Dynamic Community Feed Grid -->
                <div class="social-feed-grid" id="socialFeedContainer">
                    <!-- Dynamic Profile Cards Loaded via SocialAPI -->
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/script.js"></script>
    <script src="../js/social-api.js"></script>
    <script src="../js/social.js"></script>
</body>
</html>
