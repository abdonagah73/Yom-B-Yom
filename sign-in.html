<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YOM-B-YOM | Sign In</title>

    <link rel="stylesheet" href="css/sign-in.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <div class="container" id="sign-in">

        <!-- Login -->

        <div class="form-box login">

            <form id="loginForm">

                <h1>Login</h1>

                <div class="input-box">
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        autocomplete="email"
                    >
                    <i class="bx bxs-envelope"></i>
                </div>

                <small class="error" id="loginEmailError"></small>

                <div class="input-box">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                    >
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <small class="error" id="loginPasswordError"></small>

                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

                <p>or login with social platforms</p>

                <div class="social-icons">

                    <button type="button" class="social-btn" data-provider="Google">
                        <i class="bx bxl-google"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="Facebook">
                        <i class="bx bxl-facebook"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="GitHub">
                        <i class="bx bxl-github"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="LinkedIn">
                        <i class="bx bxl-linkedin"></i>
                    </button>

                </div>

            </form>

        </div>


        <!-- Register -->

        <div class="form-box register">

            <form id="registerForm">

                <h1>Registration</h1>

                <div class="input-box">
                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Username"
                        autocomplete="username"
                    >
                    <i class="bx bxs-user"></i>
                </div>

                <small class="error" id="registerUsernameError"></small>


                <div class="input-box">
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        autocomplete="email"
                    >
                    <i class="bx bxs-envelope"></i>
                </div>

                <small class="error" id="registerEmailError"></small>


                <div class="input-box">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                    >
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <small class="error" id="registerPasswordError"></small>


                <button type="submit" class="btn">
                    Register
                </button>

                <p>or register with social platforms</p>

                <div class="social-icons">

                    <button type="button" class="social-btn" data-provider="Google">
                        <i class="bx bxl-google"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="Facebook">
                        <i class="bx bxl-facebook"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="GitHub">
                        <i class="bx bxl-github"></i>
                    </button>

                    <button type="button" class="social-btn" data-provider="LinkedIn">
                        <i class="bx bxl-linkedin"></i>
                    </button>

                </div>

            </form>

        </div>


        <!-- Toggle -->

        <div class="toggle-box">

            <div class="toggle-panel toggle-left">

                <h1>Hello, Welcome!</h1>

                <p>Don't have an account?</p>

                <button type="button" class="btn register-btn">
                    Register
                </button>

            </div>


            <div class="toggle-panel toggle-right">

                <h1>Welcome Back!</h1>

                <p>Already have an account?</p>

                <button type="button" class="btn login-btn">
                    Login
                </button>

            </div>

        </div>

    </div>


    <script src="js/sign-in.js"></script>

</body>

</html>
